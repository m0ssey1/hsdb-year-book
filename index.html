<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leave Your Mark – 2026 Yearbook Mock-up</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600&family=Space+Grotesk:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--b:#A80019;--o:#FBFF00;--ink:#000000;--paper:#FAF7F0;--kraft:#D9B98A;--stage:#E6E2DA;--bar:#fff;--bart:#000000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#0c0c0c;--bar:#1c1c1c;--bart:#FAF7F0}}
:root[data-theme="dark"]{--stage:#0c0c0c;--bar:#1c1c1c;--bart:#FAF7F0}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--stage);color:var(--ink);font-family:"Space Grotesk",Arial,sans-serif;min-height:100vh;padding:16px 12px 90px}
.hd{text-align:center;color:var(--bart);font:12px "Space Mono",monospace;letter-spacing:.15em;margin-bottom:14px}
.stage{max-width:1100px;margin:0 auto}
.spread{display:grid;grid-template-columns:1fr 1fr;box-shadow:0 18px 50px #0004;margin-bottom:28px;position:relative;animation:in .45s ease}
.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6%;transform:translateX(-50%);background:linear-gradient(90deg,#0000,#0003 50%,#0000);pointer-events:none}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pg{aspect-ratio:1/1.32;container-type:inline-size;position:relative;overflow:hidden;background:var(--paper);padding:7cqw}
.pg.emp{background:#0000;box-shadow:none}
.fo{position:absolute;bottom:3cqw;left:7cqw;right:7cqw;font:2.4cqw "Space Mono",monospace;display:flex;justify-content:space-between;opacity:.7}
.pg.bl .fo,.pg.bk .fo{color:#fff}
.bl{background:var(--b);color:#fff}.or{background:var(--o);color:#000}.bk{background:#000;color:#fff}.kr{background:var(--o)}
.dis{font-family:"Archivo Black","Arial Black",Impact,sans-serif;line-height:.85;letter-spacing:-.03em}
.mono{font-family:"Space Mono",monospace;font-size:2.5cqw;letter-spacing:.08em;text-transform:uppercase}
.hand{font-family:Caveat,"Comic Sans MS",cursive}
h2{font-size:9cqw;letter-spacing:-.03em;line-height:1;margin-bottom:3cqw}
p{font-size:3cqw;line-height:1.5}
.cv{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.n26{color:var(--o);font-size:44cqw;text-align:center;margin-top:3cqw;text-shadow:.9cqw .9cqw 0 #000}
.ct li{list-style:none;display:grid;grid-template-columns:1fr 18cqw 22cqw;gap:2cqw;align-items:center;font-size:3cqw;padding:1.6cqw 0;border-bottom:1px solid #00000022}
.ct li small{display:block;font-style:italic;opacity:.6;font-size:2.4cqw}.ct b{font:2.4cqw "Space Mono",monospace;font-weight:400}
.strip{height:6cqw;border-radius:.5cqw;display:grid;place-items:center}.strip svg{height:70%}
.g{display:grid;gap:3cqw}.g3{grid-template-columns:repeat(3,1fr)}
.pol{background:#fff;padding:1.6cqw 1.6cqw 0;box-shadow:0 .6cqw 1.4cqw #0002;text-align:center}
.pol .ph{aspect-ratio:1/1.1;background:linear-gradient(#e6d9d9,#f7f1f1);display:flex;align-items:flex-end}
.pol .ph svg{width:100%}.pol .hand{font-size:4.2cqw;line-height:2.4}
.tl li{list-style:none;display:grid;grid-template-columns:9cqw 1fr;font-size:2.9cqw;padding:1.3cqw 0;border-left:.6cqw solid var(--o);padding-left:3cqw;position:relative}
.tl li::before{content:"";position:absolute;left:-1.3cqw;top:2cqw;width:2cqw;height:2cqw;border-radius:50%;background:var(--b)}
.tl b{font:2.5cqw "Space Mono",monospace;color:var(--b)}
.dots{background-image:radial-gradient(#FAF7F044 28%,#0000 30%);background-size:2.2cqw 2.2cqw}
.px{display:grid;grid-template-columns:repeat(2,1fr);gap:4cqw}
.px div{border:1px solid #00000033;padding:3cqw;text-align:center;background:#fff8;background-image:linear-gradient(#0000000d 1px,#0000 1px),linear-gradient(90deg,#0000000d 1px,#0000 1px);background-size:4cqw 4cqw}
.px svg{width:55%;image-rendering:pixelated}
.team{aspect-ratio:1.2/1;background:var(--ink);margin:3cqw 0 2cqw}
.mb{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;margin-right:9cqw}
.mb div{background:var(--b);border:1.4cqw solid #fff;position:relative;aspect-ratio:1/1.1}
.mb span{position:absolute;font-size:6cqw;top:-2cqw;right:-2cqw;transform:rotate(12deg)}
.mb em{position:absolute;bottom:0;font:2cqw "Space Mono",monospace;font-style:normal;background:#fff;color:var(--ink);padding:.4cqw 1cqw;left:0;right:0;text-align:center}
.vt{position:absolute;right:0;top:0;bottom:0;width:8cqw;background:#000;color:var(--o);writing-mode:vertical-rl;display:grid;place-items:center;font:700 3.4cqw "Space Grotesk",sans-serif;letter-spacing:.2em}
.lw{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw 3cqw}.lw div{text-align:center}.lw svg{width:60%}.lw .hand{font-size:3.4cqw;line-height:1.1}
.mz{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:1fr}
.num{position:absolute;inset:0;display:grid;place-items:center;font-size:92cqw;color:#fff;-webkit-text-stroke:1.2cqw var(--b);paint-order:stroke fill;text-shadow:0 0 0 #fff}
.sig{position:absolute;color:var(--ink);font-size:5cqw;white-space:nowrap}
.pq{font-size:6.4cqw;color:var(--b);line-height:1.05;margin:3cqw 0}
.bar{flex-wrap:wrap;position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bart);display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px #0003;z-index:9;font:13px "Space Mono",monospace}
.bar button{background:var(--b);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 14px "Space Grotesk",sans-serif;cursor:pointer}
.bar button.alt{background:none;color:var(--bart);border:1px solid currentColor}
.bar button:disabled{opacity:.35}
.scroll .spread{animation:none}
.wb{background:var(--o);color:#000;border-radius:8px;padding:10px 14px;font:600 14px "Space Grotesk",sans-serif;text-decoration:none}
.fc{position:relative;aspect-ratio:1/1.15;cursor:pointer}.fc>div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2cqw;font-size:3cqw;transition:opacity .3s}
.fi{background:#000;color:var(--o);border:.8cqw solid var(--b)}.fi small{display:block;font:2cqw "Space Mono",monospace;color:#fff;opacity:.6}.fb{background:var(--o);color:#000;opacity:0;font-size:5cqw}.fc.on .fb{opacity:1}.fc.on .fi{opacity:0}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:4cqw}.nums b{display:block;font-size:13cqw;color:var(--o)}.nums span{color:#fff}
.capt{width:100%;height:46cqw;margin-top:4cqw;border:.5cqw solid var(--ink);background:#fff;padding:3cqw;font:5cqw Caveat,cursive;resize:none}
.watch{display:inline-block;background:var(--o);color:#000;font:600 3.6cqw "Space Grotesk",sans-serif;padding:2.6cqw 5cqw;border-radius:99px;border:0;text-decoration:none;cursor:pointer;box-shadow:.8cqw .8cqw 0 var(--b)}
.poster{width:100%;aspect-ratio:2.1/1;background:linear-gradient(135deg,#A80019,#000);display:grid;place-items:center;margin:4cqw 0;border:.6cqw solid var(--o)}
.play{width:16cqw;height:16cqw;border-radius:50%;background:var(--o);color:#000;display:grid;place-items:center;font-size:7cqw;padding-left:1cqw}
.qr{background:#fff;padding:1.2cqw}.qr img,.qr canvas{width:100%!important;height:auto!important}
@media(max-width:700px){.spread{grid-template-columns:1fr}.spread::after{display:none}.pg.emp{display:none}.bar span{display:none}}
</style></head><body>

S.splice(9,0,N1);S.splice(11,0,N2);
let i=0,scroll=false;
const lbl=["Front cover","Title page","Contents & welcome","Our year","Faces","Portraits","Voices","Clubs & sport","Staff & Made By","Superlatives & numbers","Last words","Time capsule & documentary","Signature mosaic","Thanks & back cover"];
const sp=k=>`<div class="spread">${S[k][0]+S[k][1]}</div>`;
function draw(){const st=$("#st");st.className="stage"+(scroll?" scroll":"");
 st.innerHTML=scroll?S.map((_,k)=>sp(k)).join(""):sp(i);
 $("#ct").textContent=scroll?"All spreads":`${lbl[i]} · ${i+1}/${S.length}`;
 $("#pv").disabled=!scroll&&i==0;$("#nx").disabled=!scroll&&i==S.length-1;$("#pv").style.display=$("#nx").style.display=scroll?"none":"";
 $("#md").textContent=scroll?"Flip view":"Scroll view";post()}
const go=d=>{if(scroll)return;i=Math.max(0,Math.min(S.length-1,i+d));draw();scrollTo(0,0)};
$("#pv").onclick=()=>go(-1);$("#nx").onclick=()=>go(1);
$("#md").onclick=()=>{scroll=!scroll;draw();scrollTo(0,0)};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1)});
let x0;addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60)go(dx<0?1:-1)},{passive:true});
function post(){document.querySelectorAll(".qr").forEach(e=>{e.innerHTML="";try{new QRCode(e,{text:DOC_URL,width:160,height:160,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M})}catch(x){e.textContent="QR"}});
document.querySelectorAll("[data-to]").forEach(e=>{const t=+e.dataset.to,s0=performance.now();(function f(n){const p=Math.min(1,(n-s0)/1200);e.textContent=Math.round(t*p).toLocaleString("en-ZA");if(p<1)requestAnimationFrame(f)})(s0)});
try{const v=localStorage.getItem("cap26"),c=document.getElementById("cap");if(c&&v)c.value=v}catch(x){}}
function saveCap(){const c=$("#cap").value,m=$("#capm");try{localStorage.setItem("cap26",c);m.textContent="Sealed ✓ see you in 2036"}catch(x){m.textContent="Saved for this visit only"}}
$("#doc").href=DOC_URL;
draw();
</script></body></html>
